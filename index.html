<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS3 BATS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="js-error" style="display:none; background:#ffdddd; color:#000; padding:8px; position:fixed; bottom:0; left:0; right:0; z-index:9999; font-family:Tahoma,Arial; font-size:13px;"></div>

<header class="topbar">
  <h1>PS3 BATS</h1>
  <button id="themeBtn">Change Theme</button>
</header>

<div id="app">
  <section class="svg-demo">
    <!-- PNG fallback for old browsers (place outline.png in project root) -->
    <img id="outline-png" src="outline.png" alt="Outlined text (fallback)" />

    <!-- Simpler SVG stroked text (better chance to render as outlines) -->
    <svg class="svg-outline" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" aria-label="Outlined text">
      <text x="20" y="75" font-family="Tahoma, Arial, sans-serif" font-size="36" direction="ltr" text-anchor="start">
        Words rendered as outlines — try it on PS3
      </text>
    </svg>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
